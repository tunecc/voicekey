              proposal: 音频反馈提示音设计：Rust 侧新增 sound.rs 基于 rodio（default-features=false 仅 WAV
                解码，底层复用 cpal）播放，OutputStream 常驻 + Sink
                注册表即发即忘；事件映射——Start=start_recorder 成功（含 resume
                与预开麦转正）、Processing=end() 进入 wait、Done=单候选定稿有文本或 Pick/Compare
                全部行出结果、Error=转写超时/开麦失败/单候选无文本或出错/Pick 全行失败，取消与行级错误不发声；设置新增扁平
                camelCase 五字段（soundEnabled 默认 true +
                soundStart/Processing/Done/Error），sanitize 未知 ID 回退默认；WAV(PCM16)
                音效放 resources/sounds 经 bundle.resources 打包，池约 6 个 CC0 素材；新命令
                preview_sound(id)（试听，不受总开关约束）与 list_sounds()；Audio.svelte
                提示音组：总开关行+四事件行（下拉+试听按钮）。测试：Rust 单测（ID 表完整性/sanitize 回退/默认值兜底）+
                spec 场景手动走查 + macOS tauri build，Windows 走 CI。详见 design.md。
