            proposal: "技术方案：merge commit 方式合并 upstream/main（6 提交：#8 音量 ducking、#7 麦克风修复、CI
              修复）；9 个交集文件按决策表取舍——上游音量实现优先（OutputVolumeDucker：默认关闭、20-100% 按比例、默认
              70%、平滑过渡、所有权让渡），fork 特有功能（录音提示音、菜单栏图标、自有更新源）原样保留；整体删除 fork
              固定值音量实现（RecordingVolume、Settings.volume、旧 UI 行），不做 settings
              迁移（无存量用户）；麦克风修复（上游 #7 与 fork #1 同一 bug 同一修法）以上游文本为准，保留 fork 的
              devices::running() 与 live 测试；新增集成规则——上游在 stop_recording
              单点还原音量，fork 专属结束路径（Esc 中止、多渠道挑选、取消预开麦）若绕过还原点则补挂
              set_active(false)；release.yml 直接采纳上游。测试策略：workspace 测试 + clippy +
              前端构建 + 实机音量三段验证 + 旧 settings.json 兼容 + fork 特性冒烟。Spec Patch：无。"
