            proposal: 沿用现有音效架构（rodio + sound.rs 单点门控 + 扁平设置字段）增量实现两方案并存：1) Settings 新增
              sound_scheme 字段（simple|custom，默认 custom，serde default + sanitize
              回退），gated_id 加 simple 固定映射分支、custom 沿用逐事件字段，总开关不变，切换只写 scheme
              不清逐事件字段；2) 简洁方案固定映射：开始=tink 类轻巧短音、处理=pop 类轻弹音、完成=轻快确认音、失败=低调柔和短音，4
              个 id 注册进 SOUNDS 池；素材上网检索，优先 Kenney Interface Sounds 其余音色（CC0
              已验证），不足补其他 CC0 来源，≤0.3s 柔和不突兀，转码与 LICENSE 登记沿用现状；3) 新增
              simple_scheme() 命令由 Rust 常量表生成映射供前端只读展示，preview_sound 复用；4)
              Audio.svelte 顶部加方案单选，simple 隐藏逐事件下拉改只读映射行+试听，custom 恢复现有
              UI。取舍：已否决预设按钮改写逐事件字段（丢失用户选择）、NSSound 系统音（不可再分发、Windows
              无等价）、纯双音（完成/失败无反馈）。风险：音色与 Tink/Pop 有差距（同包选变体试听，换 WAV
              不动代码）、旧配置兼容（serde default 兜底）、素材授权（只取 CC0 逐文件登记）。测试：Rust
              单测覆盖音池/门控/兜底，前端构建+手动核对，Verify 按 delta spec 15 场景逐条验收。Spec
              Patch：无，delta spec 已完整覆盖。
