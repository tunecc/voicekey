          CC0 来源，≤0.3s 柔和不突兀，转码与 LICENSE 登记沿用现状；3) 新增 simple_scheme() 命令由 Rust
          常量表生成映射供前端只读展示，preview_sound 复用；4) Audio.svelte 顶部加方案单选，simple
          隐藏逐事件下拉改只读映射行+试听，custom 恢复现有 UI。取舍：已否决预设按钮改写逐事件字段（丢失用户选择）、NSSound
          系统音（不可再分发、Windows 无等价）、纯双音（完成/失败无反馈）。风险：音色与 Tink/Pop 有差距（同包选变体试听，换 WAV
          不动代码）、旧配置兼容（serde default 兜底）、素材授权（只取 CC0 逐文件登记）。测试：Rust
          单测覆盖音池/门控/兜底，前端构建+手动核对，Verify 按 delta spec 15 场景逐条验收。Spec
          Patch：无，delta spec 已完整覆盖。
