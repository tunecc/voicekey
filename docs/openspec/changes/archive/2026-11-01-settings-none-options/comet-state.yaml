            proposal: 统一保留字 none 贯通前后端：音效四字段与 hold_key 新增合法值 none（D1）；sanitize 保留 none、其余未知
              id 仍回退默认，serde 缺省仍落默认值保证向后兼容（D2）；长按停用复用 hotkey.rs
              Config::set_hold(&[]) 既有空组合路径，hold=0
              时热键状态机无新分支，点按判定独立不受影响（D3）；托盘头部按 hold/tap
              设置状态组合生成文案，停用侧不出现、空按键名不出现（D3）；前端 Audio.svelte
              事件下拉加「无」并隐藏该行试听按钮、Keys.svelte
              长按选择加「无（停用长按）」且卡片复用未设置样式（D4）。风险：旧版应用读 none 会回退默认（跨版本迁移不在范围）；none 时
              play_duration 走 0 时长压音量路径需测试锁定；托盘四种组合需单测。测试策略：cargo test -p
              voicekey（sanitize/gated_id/play_duration/hotkey/托盘文案用例）+ npm run
              build + store.test.mjs + 手动走查 specs 场景。Spec Patch：无（Open 阶段 delta
              spec 已含全部验收场景）。
