              只需 TAURI_SIGNING_PRIVATE_KEY 一项（无口令密钥，口令 Secret
              留空即合法）。风险取舍新增披露：无口令私钥意味着拿到密钥文件即可签名，属个人 fork 的常见取舍，密钥仅存本机与 GitHub
              加密 Secrets。测试策略不变：配置 JSON 校验、cargo check、npm build；发布链路验收依赖打
              tag（README 注明验证时点）。Spec Patch：无。
